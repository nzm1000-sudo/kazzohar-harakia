<!DOCTYPE html>
<html lang="he" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>כזוהר הרקיע · ניצוצא</title>
    <link rel="manifest" href="%BASE_URL%manifest.webmanifest" />
    <!-- Icons for every way the site is saved: browser tab and bookmarks, iPhone "Add to Home Screen" (180px, the size
         Safari expects), Android (the manifest), and link previews when the site is shared. -->
    <link rel="icon" type="image/png" sizes="32x32" href="%BASE_URL%branding/kazzohar-icon-32.png" />
    <link rel="icon" type="image/png" sizes="192x192" href="%BASE_URL%branding/kazzohar-icon-192.png" />
    <link rel="apple-touch-icon" href="%BASE_URL%apple-touch-icon.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="%BASE_URL%apple-touch-icon.png" />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="כזוהר הרקיע" />
    <meta property="og:title" content="כזוהר הרקיע" />
    <meta property="og:description" content="זמנים, לוח, תפילה, לימוד ומקורות יהודיים" />
    <meta property="og:image" content="https://nzm1000-sudo.github.io/kazzohar-harakia/branding/kazzohar-icon-512.png" />
    <meta name="twitter:card" content="summary" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="כזוהר הרקיע" />
    <meta name="theme-color" content="#f5f2ea" />
    <style>
      * { box-sizing: border-box; margin: 0; padding: 0; }
      /* First paint matches the saved theme (set below), so no dark flash on a light theme or vice versa. */
      body { background: #f5f2ea; }
      body[data-prepaint="dark"] { background: #101512; }
      body[data-prepaint="amber"] { background: #211d2b; }
    </style>
    <script>
      try { var t = localStorage.getItem('kz-theme') || (localStorage.getItem('kz-dark') === '1' ? 'dark' : 'light'); if (t === 'dark' || t === 'amber') document.documentElement.setAttribute('data-prepaint', t); } catch (e) {}
      document.addEventListener('DOMContentLoaded', function () { var p = document.documentElement.getAttribute('data-prepaint'); if (p) document.body.setAttribute('data-prepaint', p); });
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
